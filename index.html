<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<header class="header">
    <div class="header-top">
        <img id="foto-loja" class="logo" src="" alt="Logo da Loja">
        <p id="nome-loja" class="nome-loja"></p>
    </div>

    <div class="header-textos">
        <h2 id="boas-vindas"></h2>
        <p id="subtexto"></p>
    </div>

    <div class="header-info" id="infoEntrega"></div>
</header>

<main class="main">

    <section id="destaque">
        <div class="card-destaque">
            <div class="organiza-deitado">
                <span class="fundo-icon">
                    <i class="bi bi-stars icon-cor"></i>
                </span>
                <h4>Recomendado para voce</h4>
            </div>
            <div class="sugestao" id="produtoDestaque"></div>
        </div>
    </section>

    <section id="categorias">
        <h3 class="titulo-categorias">Categorias</h3>
        <div class="categorias-container" id="listaCategorias"></div>
    </section>

    <section id="produtos">
        <h3 class="titulo-produtos" id="tituloProdutos">Todos os Produtos</h3>
        <div class="produtos-container" id="listaProdutos"></div>
    </section>

</main>

<button type="button" class="carrinho-btn" id="abrirCarrinho" aria-label="Abrir carrinho">
    <i class="bi bi-cart3"></i>
    <span id="badgeCarrinho" class="badge-oculto">0</span>
</button>

<div class="carrinho-overlay" id="carrinhoOverlay">
    <div class="carrinho-painel">
        <div class="carrinho-header">
            <h3>Seu Carrinho</h3>
            <button type="button" id="fecharCarrinho" aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
        </div>

        <div class="carrinho-tipo">
            <label for="tipoPedido">Tipo de Pedido</label>
            <select id="tipoPedido">
                <option value="delivery">Delivery</option>
                <option value="retirada">Retirada no Balcao</option>
                <option value="mesa">Mesa</option>
            </select>
        </div>

        <!-- Campos condicionais: Mesa -->
        <div class="carrinho-campos-condicional" id="camposMesa" style="display: none;">
            <div class="campo-form">
                <label for="numeroMesa">Numero da Mesa</label>
                <input type="text" id="numeroMesa" placeholder="Ex: 5" maxlength="10">
            </div>
        </div>

        <!-- Campos condicionais: Delivery -->
        <div class="carrinho-campos-condicional" id="camposDelivery">
            <div class="campo-form">
                <label for="clienteNome">Nome</label>
                <input type="text" id="clienteNome" placeholder="Seu nome" maxlength="120">
            </div>
            <div class="campo-form">
                <label for="clienteTelefone">Telefone (WhatsApp)</label>
                <input type="tel" id="clienteTelefone" placeholder="(11) 99999-9999" maxlength="20">
            </div>
            <div class="campo-form">
                <label for="clienteRua">Rua / Logradouro</label>
                <input type="text" id="clienteRua" placeholder="Rua, avenida, etc." maxlength="200">
            </div>
            <div class="campo-form-row">
                <div class="campo-form campo-form-numero">
                    <label for="clienteNumero">Numero</label>
                    <input type="text" id="clienteNumero" placeholder="123" maxlength="20">
                </div>
                <div class="campo-form campo-form-bairro">
                    <label for="clienteBairro">Bairro</label>
                    <input type="text" id="clienteBairro" placeholder="Bairro" maxlength="120">
                </div>
            </div>
            <div class="campo-form">
                <label for="clienteComplemento">Complemento</label>
                <input type="text" id="clienteComplemento" placeholder="Apto, bloco, referencia..." maxlength="200">
            </div>
        </div>

        <div class="itens-carrinho" id="itensCarrinho"></div>

        <div class="carrinho-footer">
            <p class="carrinho-total-label">Total: <strong id="totalCarrinho">0,00</strong></p>
            <button type="button" class="btn-finalizar" id="btnFinalizar" disabled>Finalizar Pedido</button>
        </div>
    </div>
</div>

<!-- Modal Produto -->
<div class="modal-overlay" id="modalProduto">
    <div class="modal">
        <div class="modal-header">
            <button type="button" class="btn-voltar" id="fecharModal"><i class="bi bi-arrow-left"></i> Voltar</button>
        </div>
        <img id="modalImg" class="modal-img" src="" alt="">
        <div class="modal-conteudo">
            <h3 id="modalNome"></h3>
            <p class="modal-preco" id="modalPreco"></p>
            <p class="modal-descricao" id="modalDescricao"></p>
            <div class="quantidade-box">
                <label>Quantidade</label>
                <div class="quantidade-controles">
                    <button type="button" class="btn-qty" id="diminuirQty">&minus;</button>
                    <input type="number" id="quantidadeProduto" value="1" min="1" max="99">
                    <button type="button" class="btn-qty" id="aumentarQty">+</button>
                </div>
            </div>
            <button type="button" class="btn-adicionar-carrinho" id="btnAddCarrinho">
                <i class="bi bi-cart-plus"></i> Adicionar ao Carrinho
            </button>
        </div>
    </div>
</div>

<!-- Modal Pedido Confirmado -->
<div class="modal-overlay" id="modalPedido">
    <div class="modal">
        <div class="modal-header">
            <button type="button" class="btn-voltar" id="fecharPedido"><i class="bi bi-x-lg"></i> Fechar</button>
        </div>
        <div class="pedido-conteudo">
            <div class="pedido-sucesso">
                <i class="bi bi-check-circle-fill"></i>
                <h3>Pedido Confirmado!</h3>
            </div>
            <p class="pedido-aviso">Acompanhe pelo WhatsApp</p>
            <p class="pedido-numero" id="pedidoNumero"></p>
            <pre class="pedido-resumo" id="pedidoResumo"></pre>
            <button type="button" class="btn-primario btn-sm" id="btnCopiarPedido"><i class="bi bi-clipboard"></i> Copiar Resumo</button>
        </div>
    </div>
</div>

<footer class="footer">
    <h3 class="footer-titulo" id="footerNome"></h3>
    <p class="footer-subtitulo">Cardapio Digital</p>
    <div class="footer-redes" id="redesSociais"></div>
</footer>

<script src="assets/js/script.js"></script>
</body>
</html>
